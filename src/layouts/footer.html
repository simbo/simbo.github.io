{% macro footer(imprintHref, imprintLabel, privacyHref, privacyLabel) %}
<footer class="footer">
  <ul>
    <li>
      <a href="/">
        <div class="label">Simbo.de</div>
      </a>
    </li>
    <li>
      <a href="{{ imprintHref }}">
        <div class="label">{{ imprintLabel }}</div>
      </a>
    </li>
    <li>
      <a href="{{ privacyHref }}">
        <div class="label">{{ privacyLabel }}</div>
      </a>
    </li>
  </ul>
  <div class="footer__repository">
    <a href="https://github.com/simbo/simbo.github.io/" target="_blank">
      <svg-icon class="is-block" icon-name="github"></svg-icon>
      <div class="label">
        simbo/simbo.github.io <span title="Last Build: {{ SITE_LAST_BUILD }}">v{{ SITE_VERSION }}</span>
      </div>
    </a>
  </div>
  <color-theme-toggle></color-theme-toggle>
</footer>
{% endmacro %}
