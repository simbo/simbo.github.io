<!doctype html>
<html lang="{{ pageLang | default('en') }}">
  <head>
    {% block head %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ pageTitle | default(SITE_TITLE) }}</title>
    <meta name="description" content="{{ pageDescription | default(SITE_DESCRIPTION) }}" />
    <meta name="author" content="{{ AUTHOR_NAME }}" />
    <meta name="copyright" content="{{ SITE_LICENSE }}" />
    <meta name="robots" content="{{ pageRobots | default('index, follow') }}" />
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="{{ pageTitle | default(SITE_TITLE) }}" />
    <meta property="og:url" content="{{ SITE_URL }}{{ pagePath | default('') }}" />
    <meta property="og:image" content="{{ SITE_URL }}screenshot.png" />
    <meta property="og:description" content="{{ pageDescription | default(SITE_DESCRIPTION) }}" />
    <meta property="profile:first_name" content="{{ AUTHOR_FIRST_NAME }}" />
    <meta property="profile:last_name" content="{{ AUTHOR_LAST_NAME }}" />
    <meta property="profile:username" content="{{ AUTHOR_USER }}" />
    <link rel="author" href="/humans.txt" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    {% if SITE_IS_PROD %}
    <script async src="https://trk.srvkist.net/trk.js" data-website-id="c9ce8bab-5c6d-45ae-8127-19de67d3dbb1"></script>
    {% endif %} {% endblock %}
  </head>
  <body>
    {% block body %}{% endblock %}
  </body>
</html>
